services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sat_sim
      POSTGRES_USER: sat_sim
      POSTGRES_PASSWORD: sat_sim
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sat_sim -d sat_sim"]
      interval: 5s
      timeout: 5s
      retries: 12

  gpu-node:
    build: .
    image: sat-simulation-backend:local
    command: ["uvicorn", "sat_simulation.services.gpu:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      SAT_SIM_DATA_DIR: /data
      SAT_SIM_GPU_GTX_PORT: 9101
      SAT_SIM_PLATFORM_GTX_RESULT_HOST: platform-node
      SAT_SIM_PLATFORM_GTX_RESULT_PORT: 9102
      SAT_SIM_GROUND_HTTP_URL: http://ground-api:8000
      SAT_SIM_YOLO_API_URL: ${SAT_SIM_YOLO_API_URL:-}
      SAT_SIM_LLM_API_URL: ${SAT_SIM_LLM_API_URL:-}
    volumes:
      - gpu-data:/data
    expose: ["8002", "9101"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 12

  ground-api:
    build: .
    image: sat-simulation-backend:local
    command: ["sh", "scripts/start-ground.sh"]
    environment:
      SAT_SIM_DATABASE_URL: postgresql+asyncpg://sat_sim:sat_sim@postgres:5432/sat_sim
      SAT_SIM_DATA_DIR: /data
      SAT_SIM_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SAT_SIM_GROUND_DOWNLINK_PORT: 9201
      SAT_SIM_PLATFORM_UPLINK_HOST: platform-node
      SAT_SIM_PLATFORM_UPLINK_PORT: 9200
      SAT_SIM_PLATFORM_HTTP_URL: http://platform-node:8001
      SAT_SIM_GPU_HTTP_URL: http://gpu-node:8002
    ports:
      - "8000:8000"
    expose: ["9201"]
    volumes:
      - ground-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      gpu-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 12

  platform-node:
    build: .
    image: sat-simulation-backend:local
    command: ["uvicorn", "sat_simulation.services.platform:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      SAT_SIM_DATA_DIR: /data
      SAT_SIM_PLATFORM_UPLINK_PORT: 9200
      SAT_SIM_GROUND_DOWNLINK_HOST: ground-api
      SAT_SIM_GROUND_DOWNLINK_PORT: 9201
      SAT_SIM_GPU_GTX_HOST: gpu-node
      SAT_SIM_GPU_GTX_PORT: 9101
      SAT_SIM_PLATFORM_GTX_RESULT_PORT: 9102
      SAT_SIM_GROUND_HTTP_URL: http://ground-api:8000
    volumes:
      - platform-data:/data
    expose: ["8001", "9200", "9102"]
    depends_on:
      ground-api:
        condition: service_healthy
      gpu-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 12

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    image: sat-simulation-web:local
    ports:
      - "3000:3000"
    depends_on:
      ground-api:
        condition: service_healthy
      platform-node:
        condition: service_healthy

volumes:
  postgres-data:
  ground-data:
  platform-data:
  gpu-data:
