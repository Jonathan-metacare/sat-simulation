appId: ai.spacezenith.sat-simulation
productName: SpaceZenith-Sim
afterPack: desktop/after-pack.cjs
directories:
  output: release
  buildResources: desktop/build
files:
  - desktop/main.mjs
  - desktop/preload.cjs
  - package.json
  - "!node_modules/.cache/**"
asar: true
asarUnpack:
  - "**/*.node"
  - "**/sharp/**"
extraResources:
  - from: .next/standalone
    to: web
  - from: .next/static
    to: web/.next/static
  - from: public
    to: web/public
  - from: desktop/python-dist/sat-sim-service.app
    to: python/sat-sim-service.app
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.developer-tools
  hardenedRuntime: false
dmg:
  title: SpaceZenith-Sim
